<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe - Step 4: AI Inference</title>
    <style>
        

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
        }

        .device {
            width: 320px;
            height: 600px;
            border: 12px solid #333;
            border-radius: 36px;
            background-color: #fff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }
        
        /* iPhone Notch */
        .device::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 25px;
            background-color: #333;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            z-index: 1000;
        }

        .header {
            padding-top: 35px;
            border-bottom: 1px solid #ccc;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            background-color: #fafafa;
        }

        .progress-bar {
            height: 8px;
            border-bottom: 1px solid #ccc;
            background-color: #fff;
            position: relative;
        }
        .progress-bar::after {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 80%;
            background-color: #333;
            border-right: 1px solid #ccc;
        }

        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            
        }

        .instruction {
            font-size: 20px;
            margin-bottom: 15px;
            text-align: center;
        }

        .image-preview {
            width: 100%;
            height: 200px;
            border: 1px solid #999;
            border-radius: 5px;
            background-color: #f9f9f9;
            position: relative;
            margin-bottom: 15px;
            background-image: 
                linear-gradient(45deg, #eee 25%, transparent 25%),
                linear-gradient(-45deg, #eee 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #eee 75%),
                linear-gradient(-45deg, transparent 75%, #eee 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        /* Fake Bounding Box */
        .bounding-box {
            position: absolute;
            top: 40px;
            left: 50px;
            width: 100px;
            height: 80px;
            border: 1px solid #999;
            background-color: rgba(0,0,0,0.1);
        }
        .bounding-label {
            position: absolute;
            top: -22px;
            left: -2px;
            background-color: #333;
            color: #fff;
            padding: 2px 5px;
            font-size: 14px;
            font-weight: bold;
        }

        .prediction-card {
            border: 1px solid #999;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .stack-prompt {
            border: 2px dashed #333;
            padding: 15px;
            border-radius: 5px;
            background-color: #f9f9f9;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .stack-prompt h4 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            border: 1px solid #999;
            padding: 8px;
            font-size: 16px;
            font-family: inherit;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 2px 2px 0px #333;
            font-weight: bold;
            background-color: #fff;
            color: #333;
        }
        .btn-primary {
            width: 100%;
            border: 1px solid #444;
            padding: 12px;
            font-size: 16px;
            font-family: inherit;
            border-radius: 6px;
            background-color: #444;
            color: #fff;
            font-weight: 500;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <div class="device">
        <div class="header">
            Step 4: AI Results
        </div>
        <div class="progress-bar"></div>
        
        <div class="content">
            <div class="instruction">See the model advisory.</div>
            
            <div class="image-preview">
                <div class="bounding-box">
                    <div class="bounding-label">Container: 89%</div>
                </div>
            </div>

            <div class="prediction-card">
                AI Status: High Confidence Match
            </div>

            <div class="stack-prompt">
                <h4><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; color: #333;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg> Spatial Duplicate Alert</h4>
                <p style="font-size: 14px; margin: 0 0 10px 0;">A similar incident was mapped nearby.</p>
                <div class="btn-group">
                    <button class="btn btn-primary">Merge Reports</button>
                    <button class="btn">Keep Separate</button>
                </div>
            </div>

            <button class="btn btn-primary" style="margin-top: auto;">Continue</button>
        </div>
    </div>

</body>
</html>
