<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe - Step 1: Habitat Evidence</title>
    <style>
        

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
        }

        .device {
            width: 320px;
            height: 600px;
            border: 12px solid #333;
            border-radius: 36px;
            background-color: #fff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }
        
        /* iPhone Notch */
        .device::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 25px;
            background-color: #333;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            z-index: 1000;
        }

        .header {
            padding-top: 35px;
            border-bottom: 1px solid #ccc;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            background-color: #fafafa;
        }

        .progress-bar {
            height: 8px;
            border-bottom: 1px solid #ccc;
            background-color: #fff;
            position: relative;
        }
        .progress-bar::after {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 20%;
            background-color: #333;
            border-right: 1px solid #ccc;
        }

        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .instruction {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .image-placeholder {
            width: 100%;
            height: 250px;
            border: 2px dashed #333;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: #999;
            background-color: #f9f9f9;
            margin-bottom: 30px;
        }

        .btn {
            width: 100%;
            border: 1px solid #999;
            padding: 12px;
            font-size: 20px;
            font-family: inherit;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 3px 3px 0px #333;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .btn-primary {
            width: 100%;
            border: 1px solid #444;
            padding: 12px;
            font-size: 16px;
            font-family: inherit;
            border-radius: 6px;
            background-color: #444;
            color: #fff;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-secondary {
            background-color: #fff;
            color: #333;
        }

    </style>
</head>
<body>

    <div class="device">
        <div class="header">
            Step 1: Take Image
        </div>
        <div class="progress-bar"></div>
        
        <div class="content">
            <div class="instruction">Provide photographic evidence of the breeding site.</div>
            
            <div class="image-placeholder">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>
            </div>

            <button class="btn btn-primary">Upload Evidence</button>
            <button class="btn btn-secondary">Retake Photo</button>
        </div>
    </div>

</body>
</html>
