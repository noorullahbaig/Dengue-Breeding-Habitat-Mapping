<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Sample - Clean Standard Font</title>
    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            /* Switched to a clean, highly legible, academic-standard sans-serif font stack */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #222;
        }

        .device {
            width: 320px;
            height: 600px;
            /* Thinner, lighter borders for a more polished Mid-Fidelity look */
            border: 1px solid #999;
            background-color: #fff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            border-bottom: 1px solid #ccc;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            background-color: #fcfcfc;
            letter-spacing: -0.5px;
        }

        .progress-bar {
            height: 4px;
            background-color: #eee;
            position: relative;
        }
        .progress-bar::after {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 20%;
            background-color: #666;
        }

        .content {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .instruction {
            font-size: 16px;
            margin-bottom: 24px;
            color: #444;
            line-height: 1.4;
        }

        .image-placeholder {
            width: 100%;
            height: 250px;
            border: 1px dashed #999;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #666;
            background-color: #f9f9f9;
            margin-bottom: 30px;
            gap: 10px;
        }

        .btn {
            width: 100%;
            border: 1px solid #ccc;
            padding: 12px;
            font-size: 16px;
            font-family: inherit;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .btn-primary {
            background-color: #444;
            color: #fff;
            border-color: #444;
        }

        .btn-secondary {
            background-color: #fff;
            color: #444;
        }

    </style>
</head>
<body>

    <div class="device">
        <div class="header">
            Step 1: Take Image
        </div>
        <div class="progress-bar"></div>
        
        <div class="content">
            <div class="instruction">Add a clear image of the breeding habitat.</div>
            
            <div class="image-placeholder">
                <!-- Clean monochrome SVG instead of text brackets -->
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
                    <circle cx="12" cy="13" r="3"></circle>
                </svg>
                <span style="font-size: 14px;">Image Upload Area</span>
            </div>

            <button class="btn btn-primary">Use photo & continue</button>
            <button class="btn btn-secondary">Retake photo</button>
        </div>
    </div>

</body>
</html>
