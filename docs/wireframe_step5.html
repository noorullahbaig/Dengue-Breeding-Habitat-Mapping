<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe - Step 5: Report Confirmation</title>
    <style>
        

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
        }

        .device {
            width: 320px;
            height: 600px;
            border: 12px solid #333;
            border-radius: 36px;
            background-color: #fff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }
        
        /* iPhone Notch */
        .device::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 25px;
            background-color: #333;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            z-index: 1000;
        }

        .header {
            padding-top: 35px;
            border-bottom: 1px solid #ccc;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            background-color: #fafafa;
        }

        .progress-bar {
            height: 8px;
            border-bottom: 1px solid #ccc;
            background-color: #333; /* 100% complete */
        }

        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            
        }

        .instruction {
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .summary-card {
            border: 1px solid #999;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #f9f9f9;
        }

        .summary-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            border-bottom: 2px dashed #ccc;
            padding-bottom: 15px;
        }
        .summary-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .thumb-box {
            width: 60px;
            height: 60px;
            border: 1px solid #999;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            background-color: #fff;
        }

        .summary-text h4 {
            margin: 0 0 5px 0;
            font-size: 18px;
        }
        .summary-text p {
            margin: 0;
            font-size: 14px;
            color: #555;
        }

        .btn {
            width: 100%;
            border: 1px solid #999;
            padding: 15px;
            font-size: 24px;
            font-family: inherit;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #333;
            font-weight: bold;
            background-color: #333;
            color: #fff;
            margin-top: auto;
        }
        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #333;
        }

    </style>
</head>
<body>

    <div class="device">
        <div class="header">
            Step 5: Confirmation
        </div>
        <div class="progress-bar"></div>
        
        <div class="content">
            <div class="instruction">Send the final evidence bundle.</div>
            
            <div class="summary-card">
                <div class="summary-row">
                    <div class="thumb-box" style="font-size: 16px;">[Img]</div>
                    <div class="summary-text">
                        <h4>Image Captured</h4>
                        <p>1 file attached (AI verified)</p>
                    </div>
                </div>
                <div class="summary-row">
                    <div class="thumb-box" style="font-size: 16px;">[Map]</div>
                    <div class="summary-text">
                        <h4>Location Confirmed</h4>
                        <p>Coordinates within KL zone</p>
                    </div>
                </div>
                <div class="summary-row">
                    <div class="thumb-box" style="font-size: 16px;">[OK]</div>
                    <div class="summary-text">
                        <h4>Privacy Consent</h4>
                        <p>Public display accepted</p>
                    </div>
                </div>
            </div>

            <button class="btn">Submit Report</button>
        </div>
    </div>

</body>
</html>
