<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Old vs New Model Compare</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; background: #f6f7fb; color: #111827; }
      .stack { display: grid; gap: 16px; }
      .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; }
      .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
      .btn { padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; }
      .btn.primary { background: #111827; color: #fff; border-color: #111827; }
      .grid2 { display: grid; grid-template-columns: repeat(2, minmax(280px, 1fr)); gap: 16px; }
      .grid3 { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 12px; }
      .metric { font-size: 14px; margin: 4px 0; }
      .label { font-weight: 700; }
      img { max-width: 100%; height: auto; border: 1px solid #e5e7eb; border-radius: 6px; }
      .drop { border: 2px dashed #94a3b8; border-radius: 10px; padding: 16px; background: #f8fafc; }
      #status { font-size: 14px; color: #374151; }
      .error { color: #b91c1c; font-weight: 700; }
      progress { width: 100%; height: 16px; }
      .feed-card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; background: #fff; }
    </style>
  </head>
  <body>
    <div class="stack">
      <div class="card">
        <h1>Old vs New 3-Class Model Assessment</h1>
        <div class="row drop">
          <input id="fileInput" type="file" accept="image/*" />
          <button class="btn primary" id="compareBtn">Compare Image</button>
          <button class="btn" id="exportBtn" disabled>Export Session JSON</button>
        </div>
        <div id="status">Upload one image to run side-by-side inference.</div>
        <div id="errorBanner" class="error"></div>
      </div>

      <div class="grid2">
        <div class="card">
          <h2>Old Model</h2>
          <div id="oldMetrics"></div>
          <img id="oldImg" alt="Old model overlay" />
        </div>
        <div class="card">
          <h2>New Model</h2>
          <div id="newMetrics"></div>
          <img id="newImg" alt="New model overlay" />
        </div>
      </div>

      <div class="card">
        <h2>Side-by-Side Overlay</h2>
        <img id="sideBySideImg" alt="Side by side overlay" />
      </div>

      <div class="card">
        <h2>Batch Evaluation</h2>
        <div class="row">
          <input id="imagesDir" size="70" value="/Users/noorullah/Desktop/FYP CODEX/ml_workspace/data/prepared/retained_three_class_yolo_v1/test/images" />
        </div>
        <div class="row">
          <input id="labelsDir" size="70" value="/Users/noorullah/Desktop/FYP CODEX/ml_workspace/data/prepared/retained_three_class_yolo_v1/test/labels" />
          <button class="btn primary" id="batchBtn">Start Batch Job</button>
          <button class="btn" id="cancelBatchBtn">Cancel Job</button>
        </div>
        <progress id="batchProgress" value="0" max="100"></progress>
        <div id="batchMeta"></div>
        <pre id="batchOut"></pre>
      </div>

      <div class="card">
        <h2>Live Scoring Feed</h2>
        <div id="feed" class="stack"></div>
      </div>

      <div class="card">
        <h2>Batch Artifacts</h2>
        <div id="artifactSummary"></div>
        <div class="grid2">
          <img id="confOld" alt="Old confusion matrix" />
          <img id="confNew" alt="New confusion matrix" />
          <img id="metricOld" alt="Old class metrics" />
          <img id="metricNew" alt="New class metrics" />
        </div>
        <img id="latencyPlot" alt="Latency comparison" />
      </div>
    </div>

    <script>
      let lastSession = null;
      let currentJobId = null;
      let pollHandle = null;
      let lastSeenProcessed = -1;
      const statusEl = document.getElementById("status");
      const errorEl = document.getElementById("errorBanner");

      function renderMetrics(targetId, data) {
        const el = document.getElementById(targetId);
        el.innerHTML = `
          <div class="metric"><span class="label">Class:</span> ${data.label}</div>
          <div class="metric"><span class="label">Confidence:</span> ${data.confidence ?? "n/a"}</div>
          <div class="metric"><span class="label">Band:</span> ${data.confidenceBand}</div>
          <div class="metric"><span class="label">Top Raw:</span> ${data.topRawLabel ?? "n/a"}</div>
          <div class="metric"><span class="label">Latency:</span> ${data.latencyMs} ms</div>
          <div class="metric"><span class="label">Detections:</span> ${data.detections.length}</div>
        `;
      }

      document.getElementById("compareBtn").addEventListener("click", async () => {
        errorEl.textContent = "";
        const input = document.getElementById("fileInput");
        if (!input.files.length) {
          statusEl.textContent = "Please select an image first.";
          return;
        }
        statusEl.textContent = "Running inference on old and new models...";
        const form = new FormData();
        form.append("image", input.files[0]);
        const res = await fetch("/compare", { method: "POST", body: form });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          const detail = err.detail || {};
          errorEl.textContent = `Compare failed (${res.status}) ${detail.code || ""}: ${detail.message || "Unknown error"} ${detail.traceId ? `[trace ${detail.traceId}]` : ""}`;
          statusEl.textContent = "Compare failed.";
          return;
        }
        const data = await res.json();
        lastSession = data;
        renderMetrics("oldMetrics", data.old);
        renderMetrics("newMetrics", data.new);
        document.getElementById("oldImg").src = data.images.oldOverlay;
        document.getElementById("newImg").src = data.images.newOverlay;
        document.getElementById("sideBySideImg").src = data.images.sideBySide;
        document.getElementById("exportBtn").disabled = false;
        statusEl.textContent = `Done. Session ${data.sessionId}`;
      });

      document.getElementById("exportBtn").addEventListener("click", () => {
        if (!lastSession) return;
        const blob = new Blob([JSON.stringify(lastSession, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `compare_session_${lastSession.sessionId}.json`;
        a.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById("batchBtn").addEventListener("click", async () => {
        errorEl.textContent = "";
        const imagesDir = document.getElementById("imagesDir").value.trim();
        const labelsDir = document.getElementById("labelsDir").value.trim();
        document.getElementById("batchOut").textContent = "Creating batch job...";
        const res = await fetch("/batch-jobs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ imagesDir, labelsDir }),
        });
        const data = await res.json();
        if (!res.ok) {
          const detail = data.detail || {};
          errorEl.textContent = `Batch start failed (${res.status}) ${detail.code || ""}: ${detail.message || "Unknown error"}`;
          return;
        }
        currentJobId = data.jobId;
        lastSeenProcessed = -1;
        document.getElementById("batchOut").textContent = `Job ${currentJobId} started`;
        document.getElementById("feed").innerHTML = "";
        document.getElementById("artifactSummary").innerHTML = "";
        if (pollHandle) clearInterval(pollHandle);
        pollHandle = setInterval(pollJob, 1200);
      });

      document.getElementById("cancelBatchBtn").addEventListener("click", async () => {
        if (!currentJobId) return;
        await fetch(`/batch-jobs/${currentJobId}/cancel`, { method: "POST" });
      });

      function renderFeed(items) {
        const feed = document.getElementById("feed");
        feed.innerHTML = items
          .slice()
          .reverse()
          .map((item) => `
            <div class="feed-card">
              <div><strong>${item.image}</strong> | GT: ${item.groundTruth} | Winner: ${item.winner}</div>
              <div class="grid3">
                <div>
                  <div>Old: ${item.old.label} (${item.old.confidence ?? "n/a"}) ${item.old.latencyMs}ms</div>
                  <img src="${item.overlays.old}" alt="old overlay" />
                </div>
                <div>
                  <div>New: ${item.new.label} (${item.new.confidence ?? "n/a"}) ${item.new.latencyMs}ms</div>
                  <img src="${item.overlays.new}" alt="new overlay" />
                </div>
                <div>
                  <div>Side-by-side</div>
                  <img src="${item.overlays.pair}" alt="pair overlay" />
                </div>
              </div>
            </div>
          `)
          .join("");
      }

      async function pollJob() {
        if (!currentJobId) return;
        const [statusRes, previewRes] = await Promise.all([
          fetch(`/batch-jobs/${currentJobId}`),
          fetch(`/batch-jobs/${currentJobId}/preview`),
        ]);
        const statusData = await statusRes.json();
        const previewData = await previewRes.json();
        if (!statusRes.ok) {
          clearInterval(pollHandle);
          pollHandle = null;
          errorEl.textContent = `Polling failed for job ${currentJobId}`;
          return;
        }
        const processed = statusData.processed || 0;
        if (processed < lastSeenProcessed) {
          return;
        }
        lastSeenProcessed = processed;
        document.getElementById("batchProgress").value = statusData.percent || 0;
        const now = Date.now();
        const hb = statusData.lastHeartbeatAt ? Date.parse(statusData.lastHeartbeatAt) : null;
        const alive = hb ? ((now - hb) / 1000) < 12 : false;
        const slowAlive = alive && statusData.status === "running" && (statusData.imagesPerMinute || 0) < 1.0;
        const stateLabel = statusData.status === "queued"
          ? "queued"
          : statusData.status === "cancel_requested"
            ? "cancelled"
            : statusData.status;
        document.getElementById("batchMeta").textContent = `Status: ${stateLabel}${slowAlive ? " (slow but alive)" : ""} | ${statusData.processed}/${statusData.total} | ${statusData.percent}% | Current: ${statusData.currentFile || "-"} | Elapsed: ${statusData.elapsedSeconds}s | Throughput: ${statusData.imagesPerMinute || 0}/min`;
        if (previewRes.ok && (previewData.items || []).length >= processed) renderFeed(previewData.items || []);

        if (statusData.status === "completed") {
          clearInterval(pollHandle);
          pollHandle = null;
          const resultRes = await fetch(`/batch-jobs/${currentJobId}/result`);
          const resultData = await resultRes.json();
          document.getElementById("batchOut").textContent = JSON.stringify(resultData.metrics, null, 2);
          document.getElementById("artifactSummary").innerHTML = `
            <div>Macro-F1 delta (new-old): ${resultData.metrics.decision.macroF1Delta_new_minus_old.toFixed(4)}</div>
            <div>P95 latency delta ms (new-old): ${resultData.metrics.decision.p95LatencyDeltaMs_new_minus_old.toFixed(2)}</div>
            <div>Drain inlet FN old/new: ${resultData.metrics.decision.drainInletFalseNegatives.old} / ${resultData.metrics.decision.drainInletFalseNegatives.new}</div>
            <div><a href="${resultData.artifacts.csv}" target="_blank">Open per-image CSV</a></div>
          `;
          document.getElementById("confOld").src = resultData.artifacts.confusionOld;
          document.getElementById("confNew").src = resultData.artifacts.confusionNew;
          document.getElementById("metricOld").src = resultData.artifacts.classMetricsOld;
          document.getElementById("metricNew").src = resultData.artifacts.classMetricsNew;
          document.getElementById("latencyPlot").src = resultData.artifacts.latencyComparison;
        }
        if (statusData.status === "failed" || statusData.status === "cancel_requested") {
          clearInterval(pollHandle);
          pollHandle = null;
          errorEl.textContent = statusData.status === "failed"
            ? "Batch job failed. Check health/details and output error trace."
            : "Batch job cancelled.";
        }
      }
    </script>
  </body>
</html>
