# Production Docker Compose for DengueWatch KL
# Runs on EC2 instance, connects to external RDS PostgreSQL/PostGIS
# 
# IMPORTANT: This does NOT create a PostgreSQL container.
# You must create RDS PostgreSQL instance separately via AWS Console.

services:
  backend:
    image: denguewatch/backend:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: denguewatch-backend
    restart: unless-stopped
    
    environment:
      APP_ENV: production
      # Database connection to RDS (set in .env.production)
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      
      # Model and storage paths
      MODEL_PATH: /app/models/best.pt
      UPLOAD_ROOT: /app/uploads
      
      # CORS origins (frontend URL)
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.production}
      
      # AWS Cognito authentication
      COGNITO_REGION: ${COGNITO_REGION:-}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID:-}
      
      # S3 storage for permanent uploaded evidence images
      STORAGE_BACKEND: s3
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env.production}
      S3_REGION: ${S3_REGION:-ap-southeast-1}
      S3_PRESIGNED_URL_EXPIRES_SECONDS: ${S3_PRESIGNED_URL_EXPIRES_SECONDS:-3600}
      
      # iDengue hotspot endpoint (optional override)
      IDENGUE_HOTSPOT_ENDPOINT: ${IDENGUE_HOTSPOT_ENDPOINT:-https://mygis.mysa.gov.my/erica1/rest/services/iDengue/WM_idengue/MapServer/0/query}
    
    # DO NOT expose port 8000 publicly - nginx reaches backend internally via Docker network
    expose:
      - "8000"
    
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - denguewatch-network

  nginx:
    image: denguewatch/nginx:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-cognito}
        VITE_COGNITO_REGION: ${VITE_COGNITO_REGION:-}
        VITE_COGNITO_USER_POOL_ID: ${VITE_COGNITO_USER_POOL_ID:-}
        VITE_COGNITO_USER_POOL_CLIENT_ID: ${VITE_COGNITO_USER_POOL_CLIENT_ID:-}
        VITE_COGNITO_HOSTED_UI_DOMAIN: ${VITE_COGNITO_HOSTED_UI_DOMAIN:-}
        VITE_COGNITO_REDIRECT_SIGN_IN: ${VITE_COGNITO_REDIRECT_SIGN_IN:-}
        VITE_COGNITO_REDIRECT_SIGN_OUT: ${VITE_COGNITO_REDIRECT_SIGN_OUT:-}
    container_name: denguewatch-nginx
    restart: unless-stopped
    
    ports:
      - "80:80"
      - "443:443"
    
    # Optional: Mount SSL certificates for HTTPS
    # Uncomment when using Let's Encrypt or custom certificates
    # volumes:
    #   - /etc/letsencrypt:/etc/letsencrypt:ro
    #   - /var/www/certbot:/var/www/certbot:ro
    
    depends_on:
      backend:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    networks:
      - denguewatch-network

networks:
  denguewatch-network:
    driver: bridge

# Image files are request-scoped scratch data on EC2. Permanent media is stored in S3.
